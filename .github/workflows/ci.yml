name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-20.04, ubuntu-22.04, ubuntu-24.04]
        build_type: [Release]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          git \
          libeigen3-dev \
          libopencv-dev \
          libgoogle-glog-dev \
          libgflags-dev \
          libatlas-base-dev \
          libsuitesparse-dev

    - name: Cache Ceres Solver
      id: cache-ceres
      uses: actions/cache@v4
      with:
        path: thirdparty/ceres-solver/install
        key: ceres-2.1.0-${{ matrix.os }}-${{ matrix.build_type }}

    - name: Build Ceres Solver
      if: steps.cache-ceres.outputs.cache-hit != 'true'
      run: |
        cd thirdparty
        git clone https://github.com/ceres-solver/ceres-solver
        cd ceres-solver
        git checkout 2.1.0
        mkdir -p build install
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_INSTALL_PREFIX="../install/" \
          -DBUILD_EXAMPLES=OFF \
          -DBUILD_BENCHMARKS=OFF \
          -DBUILD_TESTING=OFF
        make -j$(nproc) install

    - name: Cache Sophus
      id: cache-sophus
      uses: actions/cache@v4
      with:
        path: thirdparty/Sophus/install
        key: sophus-${{ matrix.os }}-${{ matrix.build_type }}

    - name: Build Sophus
      if: steps.cache-sophus.outputs.cache-hit != 'true'
      run: |
        cd thirdparty
        git clone https://github.com/strasdat/Sophus
        cd Sophus
        mkdir -p build install
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_INSTALL_PREFIX="../install/" \
          -DBUILD_SOPHUS_TESTS=OFF
        make -j$(nproc) install

    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_INSTALL_PREFIX="../install/"

    - name: Build
      run: |
        cd build
        make -j$(nproc)

